<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
        <div class="left-side">
            <div class="image-container">
                <div class="logo-container">
                    <img src="images/odin-logo.png" alt="The Odin Project Logo" class="logo">
                    <h1 class="logo-header">ODIN</h1>
                </div>
                <div class="logo-footer">
                    <a class="footer-link" href="#">Credits Page</a>
                    <p>|</p>
                    <a class="footer-link" href="#">GitHub</a>
                </div>
            </div>
        </div>
        <div class="right-side">
            <div class="right-container">
                <div class="text-info">
                    <p class="text">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
                    <p class="text">Sign up <i>now</i> to get started.</p>
                    <p class="text" id="separate-text">You know you want to.</p>
                </div>
                <form action="#">
                    <fieldset class="upper-form-container">
                        <div class="form-heading">
                            <h3>Join the grid!</h3>
                        </div>
                        <div class="form-column left-form-column">
                            <div class="input-container">
                                <label for="user_first_name">FIRST NAME</label>
                                <input type="text" name="user_first_name" id="user_first_name" required>
                            </div>
                            <div class="input-container">
                                <label for="user_email">EMAIL</label>
                                <input type="email" name="user_email" id="user_email" required>
                            </div>
                            <div class="input-container">
                                <label for="password">PASSWORD</label>
                                <input type="password" name="password" id="password" minlength="8" required>
                                <span class="input-validation" id="pass"></span>
                            </div>
                        </div>
                        <div class="form-column right-form-column">
                            <div class="input-container">
                                <label for="user_last_name">LAST NAME</label>
                                <input type="text" name="user_last_name" id="user_last_name" required>
                            </div>
                            <div class="input-container">
                                <label for="user_number">PHONE NUMBER</label>
                                <input type="tel" name="user_number" id="user_number" required>
                            </div>
                            <div class="input-container">
                                <label for="password_confirm">CONFIRM PASSWORD</label>
                                <input type="password" name="password_confirm" id="password_confirm" minlength="8" required>
                                <span class="input-validation" id="pass-confirm"></span>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset class="lower-form-container">
                        <input type="submit" value="Create Account" class="submit-button">
                        <p class="text" id="log-in-text">Already have an account? <a id="log-in-link" href="#">Log in</a></p>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
